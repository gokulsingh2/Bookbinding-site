<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>Loader Preview</title>
<style>
  :root { --leather: #0b2f5c; --accent: #2f8fe6; }
  body { margin: 0; height: 100vh; background: linear-gradient(135deg, #dbe9fb, #f4f8fc); display: flex; align-items: center; justify-content: center; font-family: -apple-system, sans-serif; }
  button { position: fixed; bottom: 30px; left: 50%; transform: translateX(-50%); padding: 12px 22px; border-radius: 20px; border: 2px solid var(--leather); background: #fff; color: var(--leather); font-weight: 700; cursor: pointer; }
</style>
</head>
<body>

<div id="pageTransition" class="page-transition is-active" aria-hidden="true">
  <div class="loader">
    <span class="loader__pulse"></span>
    <span class="loader__pulse"></span>
    <span class="loader__pulse"></span>
    <span class="loader__core"></span>
  </div>
</div>

<button onclick="document.getElementById('pageTransition').classList.toggle('is-active')">Toggle on/off</button>

<style>
.page-transition {
  position: fixed; inset: 0;
  background: rgba(10, 30, 51, 0.42);
  backdrop-filter: blur(16px) saturate(1.15);
  -webkit-backdrop-filter: blur(16px) saturate(1.15);
  display: flex; align-items: center; justify-content: center;
  z-index: 9999; opacity: 0; pointer-events: none;
  transition: opacity 0.35s ease;
}
.page-transition.is-active { opacity: 1; pointer-events: all; }

.loader { position: relative; width: 64px; height: 64px; }
.loader__core {
  position: absolute; inset: 24px; border-radius: 50%;
  background: linear-gradient(135deg, var(--accent), var(--leather));
  box-shadow: 0 0 18px rgba(47, 143, 230, 0.6);
}
.loader__pulse {
  position: absolute; inset: 0; border-radius: 50%;
  border: 2px solid var(--accent); opacity: 0;
}
.page-transition.is-active .loader__pulse { animation: loaderPulse 1.5s cubic-bezier(0.2, 0.6, 0.35, 1) infinite; }
.page-transition.is-active .loader__pulse:nth-child(2) { animation-delay: 0.5s; }
.page-transition.is-active .loader__pulse:nth-child(3) { animation-delay: 1s; }
@keyframes loaderPulse {
  0%   { transform: scale(0.35); opacity: 0.65; border-width: 3px; }
  100% { transform: scale(1.7); opacity: 0; border-width: 0.5px; }
}
</style>
</body>
</html>
