  <path d="M286 273 H518 C534 273 542 281 542 294 V310 C542 323 534 331 520 331 H315" fill="none" stroke="#bcbcbc" stroke-width="3" opacity="0.65" />
  <path d="M276 348 H510" fill="none" stroke="#bcbcbc" stroke-width="3" opacity="0.65" />
