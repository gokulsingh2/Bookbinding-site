<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" width="800" height="800" role="img" aria-labelledby="favTitle favDesc">
  <title id="favTitle">RJ Printing Hub Logo</title>
  <desc id="favDesc">Dark circular badge logo with three stylized books and white "RJ Printing HUB" typography</desc>
  <defs>
    <filter id="favSoftShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#000000" flood-opacity="0.45" />
    </filter>
    <linearGradient id="favCircleGradient" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#454547" />
      <stop offset="100%" stop-color="#303033" />
    </linearGradient>
    <linearGradient id="favBookHighlight" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="50%" stop-color="#e9e9e9" />
      <stop offset="100%" stop-color="#ffffff" />
    </linearGradient>
    <style>
      .favBookLine { fill: none; stroke: url(#favBookHighlight); stroke-width: 10; stroke-linecap: round; stroke-linejoin: round; }
      .favMainTitle { fill: #ffffff; font-family: Impact, Haettenschweiler, "Arial Narrow Bold", Arial, sans-serif; font-weight: 900; letter-spacing: -1px; }
    </style>
  </defs>

  <circle cx="400" cy="400" r="285" fill="url(#favCircleGradient)" filter="url(#favSoftShadow)" />
  <circle cx="400" cy="400" r="280" fill="none" stroke="#5a5a5c" stroke-width="2" opacity="0.8" />

