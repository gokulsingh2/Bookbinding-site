<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Auth Test — Book Binding Co.</title>
  <link rel="stylesheet" href="/css/style.css" />
</head>
<body>
  <div class="auth-page">
    <div class="tabs">
      <button id="tabLogin" class="active" onclick="showTab('login')">Login</button>
      <button id="tabRegister" onclick="showTab('register')">Register</button>
    </div>

    <form id="loginForm" onsubmit="return handleLogin(event)">
      <h2>Login</h2>
      <label>Email</label>
      <input type="email" id="loginEmail" required />
      <label>Password</label>
      <input type="password" id="loginPassword" required />
      <button type="submit">Log in</button>
    </form>

    <form id="registerForm" style="display:none" onsubmit="return handleRegister(event)">
      <h2>Register</h2>
      <label>Name</label>
      <input type="text" id="regName" required />
      <label>Email</label>
      <input type="email" id="regEmail" required />
      <label>Phone (optional)</label>
      <input type="tel" id="regPhone" />
      <label>Password</label>
      <input type="password" id="regPassword" required minlength="6" />
      <button type="submit">Create account</button>
    </form>

    <div style="margin-top: 20px; display:flex; gap:8px;">
      <button style="flex:1; background:#444; color:#fff; padding:8px; border:none; border-radius:6px; cursor:pointer;" onclick="checkMe()">Check /me</button>
      <button style="flex:1; background:#444; color:#fff; padding:8px; border:none; border-radius:6px; cursor:pointer;" onclick="logout()">Logout</button>
    </div>

    <div id="result"></div>
  </div>

  <script>
    function showTab(tab) {
      document.getElementById('loginForm').style.display = tab === 'login' ? 'block' : 'none';
      document.getElementById('registerForm').style.display = tab === 'register' ? 'block' : 'none';
      document.getElementById('tabLogin').classList.toggle('active', tab === 'login');
      document.getElementById('tabRegister').classList.toggle('active', tab === 'register');
    }

    function showResult(data, isError) {
      const el = document.getElementById('result');
      el.textContent = JSON.stringify(data, null, 2);
      el.className = isError ? 'err' : 'ok';
    }

    async function handleLogin(e) {
      e.preventDefault();
      const email = document.getElementById('loginEmail').value;
      const password = document.getElementById('loginPassword').value;
      try {
        const res = await fetch('/api/auth/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          credentials: 'include',
          body: JSON.stringify({ email, password }),
        });
        const data = await res.json();
        showResult(data, !res.ok);
      } catch (err) {
        showResult({ error: err.message }, true);
      }
      return false;
    }

    async function handleRegister(e) {
      e.preventDefault();
      const name = document.getElementById('regName').value;
      const email = document.getElementById('regEmail').value;
      const phone = document.getElementById('regPhone').value;
      const password = document.getElementById('regPassword').value;
      try {
        const res = await fetch('/api/auth/register', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          credentials: 'include',
          body: JSON.stringify({ name, email, phone, password }),
        });
        const data = await res.json();
        showResult(data, !res.ok);
      } catch (err) {
        showResult({ error: err.message }, true);
      }
      return false;
    }

    async function checkMe() {
      try {
        const res = await fetch('/api/auth/me', { credentials: 'include' });
        const data = await res.json();
        showResult(data, !res.ok);
      } catch (err) {
        showResult({ error: err.message }, true);
      }
    }

    async function logout() {
      try {
        const res = await fetch('/api/auth/logout', { method: 'POST', credentials: 'include' });
        const data = await res.json();
        showResult(data, !res.ok);
      } catch (err) {
        showResult({ error: err.message }, true);
      }
    }
  </script>
</body>
</html>
