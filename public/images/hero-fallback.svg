  <line x1="160" y1="164" x2="230" y2="156" stroke="#ddccf0" stroke-width="2"/>
  <line x1="260" y1="144" x2="325" y2="152" stroke="#ddccf0" stroke-width="2"/>
  <line x1="260" y1="156" x2="325" y2="164" stroke="#ddccf0" stroke-width="2"/>
  <!-- pen -->
  <path d="M300 120 C 312 108, 330 104, 338 92 C 330 104, 328 118, 316 128 C 311 132, 302 128, 300 122 Z" fill="#ff6f59"/>
