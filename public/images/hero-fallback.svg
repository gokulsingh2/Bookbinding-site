<svg viewBox="0 0 500 400" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Illustration of a bound thesis on a desk">
  <defs>
    <linearGradient id="heroFallbackBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#8a63f5"/>
      <stop offset="55%" stop-color="#5b3fd6"/>
      <stop offset="100%" stop-color="#3c2a99"/>
    </linearGradient>
  </defs>
  <rect width="500" height="400" fill="url(#heroFallbackBg)"/>
  <!-- desk surface -->
  <rect x="0" y="300" width="500" height="100" fill="#3c2a99" opacity="0.4"/>
