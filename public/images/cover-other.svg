<svg viewBox="0 0 400 180" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="">
  <defs>
    <linearGradient id="otherBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#6c6188"/>
      <stop offset="100%" stop-color="#38304f"/>
    </linearGradient>
  </defs>
  <rect width="400" height="180" fill="url(#otherBg)"/>
  <circle cx="40" cy="20" r="55" fill="#ffffff" opacity="0.06"/>
  <circle cx="370" cy="160" r="75" fill="#ffffff" opacity="0.05"/>

  <!-- printer body -->
  <g transform="translate(150 70)">
    <rect x="0" y="30" width="120" height="46" rx="8" fill="#ffffff"/>
    <rect x="14" y="42" width="30" height="10" rx="3" fill="#38304f" opacity="0.5"/>
