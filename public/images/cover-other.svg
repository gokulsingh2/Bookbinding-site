    <rect x="18" y="4" width="84" height="30" rx="3" fill="#ffffff" opacity="0.85"/>
  </g>

  <!-- page feeding out the top -->
  <g transform="translate(178 30)">
    <rect x="0" y="0" width="64" height="46" rx="2" fill="#ffffff"/>
    <rect x="10" y="10" width="44" height="4" rx="2" fill="#8a80a8"/>
    <rect x="10" y="20" width="34" height="4" rx="2" fill="#8a80a8" opacity="0.7"/>
