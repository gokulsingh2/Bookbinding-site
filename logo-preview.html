<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Logo Preview — RJ Printing Hub</title>
<style>
  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 28px;
    background: #f4eefb;
    font-family: -apple-system, 'Work Sans', sans-serif;
  }
  .card {
    background: #fff;
    padding: 40px 56px;
    border-radius: 16px;
    box-shadow: 0 8px 24px rgba(76, 29, 122, 0.18);
    text-align: center;
  }
  .hint { color: #5b4f74; font-size: 0.9rem; margin-top: 18px; }
  .dark { background: #170f26; }
  .dark .card { background: #241a3d; box-shadow: 0 8px 24px rgba(0,0,0,0.4); }
  .dark .hint { color: #ddccf0; }
</style>
</head>
<body>
  <div class="card">
    <a href="#" class="site-logo" aria-label="RJ Printing Hub — home" style="text-decoration:none;">
      <svg class="logo-svg" width="270" height="46" viewBox="0 0 680 113" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="RJ Printing Hub">
        <defs>
          <style>@import url('https://fonts.googleapis.com/css2?family=Caveat:wght@700&amp;display=swap');</style>
          <linearGradient id="logoCoverGrad" x1="0" y1="0" x2="1" y2="1">
            <stop offset="0%" stop-color="#8a63f5"/>
            <stop offset="55%" stop-color="#5b3fd6"/>
            <stop offset="100%" stop-color="#3c2a99"/>
          </linearGradient>
          <linearGradient id="logoTextGrad" x1="0" y1="0" x2="1" y2="0">
            <stop offset="0%" stop-color="#5b3fd6"/>
            <stop offset="100%" stop-color="#8a63f5"/>
          </linearGradient>
          <radialGradient id="logoGlow" cx="50%" cy="50%" r="50%">
            <stop offset="0%" stop-color="#ff6f59" stop-opacity="0.55"/>
            <stop offset="100%" stop-color="#ff6f59" stop-opacity="0"/>
          </radialGradient>
        </defs>

        <g class="logo-mark">
          <circle class="logo-glow" cx="99" cy="63" r="58" fill="url(#logoGlow)"/>

          <g class="logo-pages">
            <rect x="60" y="47" width="70" height="48" rx="4" fill="#ddccf0" stroke="#7c5cf0" stroke-width="1"/>
            <rect x="64" y="42" width="70" height="48" rx="4" fill="#f4eefb" stroke="#7c5cf0" stroke-width="1"/>
          </g>

          <g class="logo-cover">
            <rect x="68" y="37" width="70" height="48" rx="4" fill="url(#logoCoverGrad)" stroke="#3c2a99" stroke-width="1.5"/>
            <rect x="76" y="47" width="54" height="6" rx="1.5" fill="#ffffff"/>
            <rect x="76" y="57" width="42" height="3" rx="1" fill="#ffffff" opacity="0.75"/>
            <rect x="76" y="64" width="32" height="3" rx="1" fill="#ffffff" opacity="0.55"/>
          </g>

          <g class="logo-quill">
            <path d="M120 30 C 128 22, 140 20, 146 12 C 140 20, 138 32, 130 40 C 126 44, 121 42, 120 38 Z"
                  fill="#ff6f59" stroke="#e2543f" stroke-width="1"/>
            <line x1="120" y1="38" x2="103" y2="55" stroke="#e2543f" stroke-width="2" stroke-linecap="round"/>
            <path class="logo-quill-ink" d="M100 58 C 96 60, 93 63, 90 62 C 87 61, 89 57, 92 57 C 95 57, 95 61, 92 62"
                  fill="none" stroke="#ff6f59" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
          </g>

          <path class="logo-spark logo-spark--1" d="M148 18 L150.5 24 L157 26.5 L150.5 29 L148 35 L145.5 29 L139 26.5 L145.5 24 Z" fill="#ffd166"/>
          <path class="logo-spark logo-spark--2" d="M56 30 L57.6 33.6 L61.2 35.2 L57.6 36.8 L56 40.4 L54.4 36.8 L50.8 35.2 L54.4 33.6 Z" fill="#ff6f59"/>
        </g>

        <text x="160" y="76" font-family="'Caveat', cursive" font-weight="700" font-size="42" fill="url(#logoTextGrad)" class="logo-text">RJ Printing Hub</text>
      </svg>
    </a>
    <p class="hint">Hover (or tap) the logo — the book opens, the quill signs a line, and the colors warm up.</p>
  </div>

  <div class="card" style="transform: scale(1.8);">
    <!-- same logo, larger, so small motion details are easy to see -->
    <a href="#" class="site-logo" aria-label="RJ Printing Hub — home (large)" style="text-decoration:none;">
      <svg class="logo-svg" width="270" height="46" viewBox="0 0 680 113" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="RJ Printing Hub">
        <defs>
          <linearGradient id="logoCoverGrad2" x1="0" y1="0" x2="1" y2="1">
            <stop offset="0%" stop-color="#8a63f5"/>
            <stop offset="55%" stop-color="#5b3fd6"/>
            <stop offset="100%" stop-color="#3c2a99"/>
          </linearGradient>
          <linearGradient id="logoTextGrad2" x1="0" y1="0" x2="1" y2="0">
            <stop offset="0%" stop-color="#5b3fd6"/>
            <stop offset="100%" stop-color="#8a63f5"/>
          </linearGradient>
          <radialGradient id="logoGlow2" cx="50%" cy="50%" r="50%">
            <stop offset="0%" stop-color="#ff6f59" stop-opacity="0.55"/>
            <stop offset="100%" stop-color="#ff6f59" stop-opacity="0"/>
          </radialGradient>
        </defs>
        <g class="logo-mark">
          <circle class="logo-glow" cx="99" cy="63" r="58" fill="url(#logoGlow2)"/>
          <g class="logo-pages">
            <rect x="60" y="47" width="70" height="48" rx="4" fill="#ddccf0" stroke="#7c5cf0" stroke-width="1"/>
            <rect x="64" y="42" width="70" height="48" rx="4" fill="#f4eefb" stroke="#7c5cf0" stroke-width="1"/>
          </g>
          <g class="logo-cover">
            <rect x="68" y="37" width="70" height="48" rx="4" fill="url(#logoCoverGrad2)" stroke="#3c2a99" stroke-width="1.5"/>
            <rect x="76" y="47" width="54" height="6" rx="1.5" fill="#ffffff"/>
            <rect x="76" y="57" width="42" height="3" rx="1" fill="#ffffff" opacity="0.75"/>
            <rect x="76" y="64" width="32" height="3" rx="1" fill="#ffffff" opacity="0.55"/>
          </g>
          <g class="logo-quill">
            <path d="M120 30 C 128 22, 140 20, 146 12 C 140 20, 138 32, 130 40 C 126 44, 121 42, 120 38 Z"
                  fill="#ff6f59" stroke="#e2543f" stroke-width="1"/>
            <line x1="120" y1="38" x2="103" y2="55" stroke="#e2543f" stroke-width="2" stroke-linecap="round"/>
            <path class="logo-quill-ink" d="M100 58 C 96 60, 93 63, 90 62 C 87 61, 89 57, 92 57 C 95 57, 95 61, 92 62"
                  fill="none" stroke="#ff6f59" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
          </g>
          <path class="logo-spark logo-spark--1" d="M148 18 L150.5 24 L157 26.5 L150.5 29 L148 35 L145.5 29 L139 26.5 L145.5 24 Z" fill="#ffd166"/>
          <path class="logo-spark logo-spark--2" d="M56 30 L57.6 33.6 L61.2 35.2 L57.6 36.8 L56 40.4 L54.4 36.8 L50.8 35.2 L54.4 33.6 Z" fill="#ff6f59"/>
        </g>
        <text x="160" y="76" font-family="'Caveat', cursive" font-weight="700" font-size="42" fill="url(#logoTextGrad2)" class="logo-text">RJ Printing Hub</text>
      </svg>
    </a>
  </div>

<style>
.logo-svg { overflow: visible; transition: filter 0.5s ease; }
.logo-mark { transform-box: fill-box; transform-origin: center; animation: logoFloat 4.5s ease-in-out infinite; }
.logo-glow { transform-box: fill-box; transform-origin: center; opacity: 0; transform: scale(0.6); transition: opacity 0.4s ease, transform 0.4s ease; }
.logo-pages { transform-box: fill-box; transform-origin: 130px 42px; transition: transform 0.45s cubic-bezier(.34,1.56,.64,1); }
.logo-cover { transform-box: fill-box; transform-origin: 68px 61px; animation: logoBreathe 3.2s ease-in-out infinite; transition: transform 0.45s cubic-bezier(.34,1.56,.64,1); }
.logo-quill { transform-box: fill-box; transform-origin: 146px 12px; animation: logoQuillIdle 2.6s ease-in-out infinite; transition: transform 0.4s ease; }
.logo-quill-ink { stroke-dasharray: 26; stroke-dashoffset: 26; opacity: 0.85; transition: stroke-dashoffset 0.7s ease 0.15s; }
.logo-spark { transform-box: fill-box; transform-origin: center; opacity: 0.35; animation: logoTwinkle 2.4s ease-in-out infinite; }
.logo-spark--1 { animation-delay: 0.3s; }
.logo-spark--2 { animation-delay: 1.1s; }
.logo-text { transition: filter 0.4s ease; }

@keyframes logoFloat { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-3px); } }
@keyframes logoBreathe { 0%, 100% { transform: scale(1) rotate(0deg); } 50% { transform: scale(1.015) rotate(-0.6deg); } }
@keyframes logoQuillIdle { 0%, 100% { transform: rotate(0deg); } 50% { transform: rotate(-4deg); } }
@keyframes logoTwinkle { 0%, 100% { opacity: 0.25; transform: scale(0.85); } 50% { opacity: 1; transform: scale(1.15); } }

.site-logo:hover .logo-svg, .site-logo:focus-visible .logo-svg { filter: hue-rotate(28deg) saturate(1.25); }
.site-logo:hover .logo-glow, .site-logo:focus-visible .logo-glow { opacity: 1; transform: scale(1); }
.site-logo:hover .logo-mark, .site-logo:focus-visible .logo-mark { animation-play-state: paused; }
.site-logo:hover .logo-pages, .site-logo:focus-visible .logo-pages { transform: rotate(-9deg) translate(-3px, 1px); }
.site-logo:hover .logo-cover, .site-logo:focus-visible .logo-cover { animation-play-state: paused; transform: rotate(7deg) scale(1.04); }
.site-logo:hover .logo-quill, .site-logo:focus-visible .logo-quill { animation-play-state: paused; transform: rotate(-16deg) translate(-4px, 3px); }
.site-logo:hover .logo-quill-ink, .site-logo:focus-visible .logo-quill-ink { stroke-dashoffset: 0; }
.site-logo:hover .logo-spark, .site-logo:focus-visible .logo-spark { animation-duration: 0.9s; }
.site-logo:active .logo-mark { transform: scale(0.96); }
</style>
</body>
</html>
