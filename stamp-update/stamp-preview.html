<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>Order Stamp Preview</title>
<style>
  :root {
    --ink: #0c2036; --paper: #ffffff; --leather: #0b2f5c; --accent: #2f8fe6;
    --ink-soft: #3d5872; --cream-deep: #eaf3fc; --paper-edge: #d3e6f7; --accent-dark: #1f5fbf;
    --font-display: 'Georgia', serif; --font-body: -apple-system, sans-serif; --font-mono: 'Courier New', monospace;
    --radius: 10px;
  }
  body { font-family: var(--font-body); background: #f4f8fc; padding: 60px; }
  .card { max-width: 640px; margin: 0 auto; background: #fff; border: 1px solid var(--paper-edge); border-radius: var(--radius); padding: 30px; }
  .btn { display:inline-block; padding: 12px 22px; border-radius: 20px; border: 2px solid var(--leather); color: var(--leather); text-decoration:none; font-weight:700; }
  button.replay { margin: 20px auto 0; display:block; padding: 8px 16px; }
</style>
</head>
<body>
<div class="card">
  <div class="confirmation__bottom" id="wrap" style="display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:28px;margin-top:8px;">
    <a href="#" class="btn">Place Another Order</a>
    <div class="order-stamp" id="orderStamp" aria-hidden="true">
      <span class="order-stamp__bleed order-stamp__bleed--1"></span>
      <span class="order-stamp__bleed order-stamp__bleed--2"></span>
      <span class="order-stamp__bleed order-stamp__bleed--3"></span>
      <span class="order-stamp__shock"></span>
      <svg viewBox="0 0 220 220" class="order-stamp__svg">
        <defs>
          <filter id="stampInkFine" x="-30%" y="-30%" width="160%" height="160%">
            <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="2" seed="7" result="n1"/>
            <feDisplacementMap in="SourceGraphic" in2="n1" scale="2.6"/>
          </filter>
          <filter id="stampInkCoarse" x="-30%" y="-30%" width="160%" height="160%">
            <feTurbulence type="fractalNoise" baseFrequency="0.045" numOctaves="3" seed="11" result="n2"/>
            <feDisplacementMap in="SourceGraphic" in2="n2" scale="6.5"/>
          </filter>
          <path id="stampArcTop" d="M 34,118 A 76,76 0 0 1 186,118" fill="none"/>
        </defs>
        <g filter="url(#stampInkCoarse)" class="order-stamp__rings">
          <circle cx="110" cy="110" r="96"/>
          <circle cx="110" cy="110" r="82" class="order-stamp__ring--dashed"/>
        </g>
        <g filter="url(#stampInkFine)" class="order-stamp__ink">
          <text class="order-stamp__arc-text">
            <textPath href="#stampArcTop" startOffset="50%" text-anchor="middle">★ RJ PRINTING HUB ★</textPath>
          </text>
          <text x="110" y="112" text-anchor="middle" class="order-stamp__headline">ORDER CONFIRMED</text>
          <line x1="55" y1="126" x2="165" y2="126" class="order-stamp__rule"/>
          <text x="110" y="152" text-anchor="middle" id="stampOrderNumber" class="order-stamp__order-no">#330001</text>
        </g>
      </svg>
    </div>
  </div>
  <button class="replay" onclick="replay()">Replay animation</button>
</div>

<style>
.order-stamp {
  position: relative; width: 148px; height: 148px; flex-shrink: 0;
  transform: rotate(-9deg) scale(1);
  animation: stampSlam 0.6s cubic-bezier(0.2, 0.9, 0.3, 1) 0.55s both;
  filter: drop-shadow(0 3px 2px rgba(11, 47, 92, 0.18));
}
.order-stamp__svg { width: 100%; height: 100%; overflow: visible; }
.order-stamp__rings, .order-stamp__ink { fill: #b21f2d; mix-blend-mode: multiply; opacity: 0.88; }
.order-stamp__rings circle { fill: none; stroke: #b21f2d; stroke-width: 3.5; }
.order-stamp__rings circle.order-stamp__ring--dashed { stroke-width: 2.4; stroke-dasharray: 3 4; }
.order-stamp__arc-text { font-family: var(--font-display); font-weight: 700; font-size: 15px; letter-spacing: 2px; }
.order-stamp__headline { font-family: var(--font-display); font-weight: 800; font-size: 20px; letter-spacing: 0.5px; }
.order-stamp__rule { stroke: #b21f2d; stroke-width: 2; }
.order-stamp__order-no { font-family: var(--font-mono); font-weight: 700; font-size: 20px; letter-spacing: 0.5px; }
.order-stamp__bleed { position: absolute; border-radius: 50%; background: #b21f2d; mix-blend-mode: multiply; opacity: 0; filter: blur(4px); pointer-events: none; }
.order-stamp__bleed--1 { width: 22px; height: 14px; top: 6%;  left: 62%; transform: rotate(18deg); }
.order-stamp__bleed--2 { width: 16px; height: 10px; top: 72%; left: 8%;  transform: rotate(-24deg); }
.order-stamp__bleed--3 { width: 12px; height: 9px;  top: 46%; left: 90%; transform: rotate(6deg); }
.order-stamp__bleed { animation: stampBleed 0.6s ease 0.85s both; }
.order-stamp__shock { position: absolute; inset: 0; border-radius: 50%; border: 2px solid rgba(178, 31, 45, 0.5); opacity: 0; animation: stampShock 0.5s ease-out 0.55s both; pointer-events: none; }
@keyframes stampSlam {
  0%   { opacity: 0; transform: rotate(-9deg) translateY(-70px) scale(2.6); }
  50%  { opacity: 1; transform: rotate(-9deg) translateY(0) scale(0.92); }
  68%  { transform: rotate(-9deg) scale(1.08); }
  84%  { transform: rotate(-9deg) scale(0.97); }
  100% { opacity: 1; transform: rotate(-9deg) scale(1); }
}
@keyframes stampBleed { 0% { opacity: 0; } 40% { opacity: 0.3; } 100% { opacity: 0.16; } }
@keyframes stampShock { 0% { opacity: 0.9; transform: scale(0.6); } 100% { opacity: 0; transform: scale(1.35); } }
</style>

<script>
function replay() {
  const stamp = document.getElementById('orderStamp');
  const clone = stamp.cloneNode(true);
  stamp.replaceWith(clone);
}
</script>
</body>
</html>
